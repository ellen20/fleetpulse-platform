name: Playwright TypeScript E2E
on:
  push:
    branches: [main, master, feature/playwright-typescript]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Start apps with Docker
      run: docker compose up --build -d
    - name: Wait for services to be ready
      run: npx wait-on http://localhost:3001 http://localhost:5173 http://localhost:5174
    - name: Seed database
      run: docker compose exec -T api node db/seed.js
    - name: Run Playwright tests
      run: npx playwright test playwright-ts/assignment-flow.spec.ts
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Stop Docker
      if: always()
      run: docker compose down